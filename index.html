<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trích xuất văn bản từ hình ảnh (OCR)</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js for OCR -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Using Google Font 'Inter' for better readability */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        <!-- Header Section -->
        <div class="text-center border-b pb-4">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800">Trích xuất Văn bản từ Hình ảnh</h1>
            <p class="text-gray-600 mt-2">Sử dụng Tesseract.js để nhận dạng ký tự (OCR) ngay trên trình duyệt của bạn.</p>
        </div>

        <!-- Language Selection -->
        <div>
            <label for="lang-select" class="block text-lg font-medium text-gray-700 mb-2">1. Chọn ngôn ngữ nhận dạng</label>
            <select id="lang-select" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-white">
                <option value="vie" selected>Tiếng Việt</option>
                <option value="eng">Tiếng Anh (English)</option>
                <option value="chi_sim">Tiếng Trung (Simplified Chinese)</option>
            </select>
        </div>

        <!-- Input Section: File Upload or Camera -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center bg-gray-50 p-6 rounded-lg">
            <div>
                <label class="block text-lg font-medium text-gray-700 mb-2">2. Tải ảnh lên</label>
                <div class="flex items-center justify-center w-full">
                    <label for="image-upload" class="flex flex-col items-center justify-center w-full h-40 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-white hover:bg-gray-100 transition-colors">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center">
                            <i class="fas fa-cloud-upload-alt text-4xl text-gray-500"></i>
                            <p class="my-2 text-sm text-gray-500"><span class="font-semibold">Nhấn để chọn file</span></p>
                            <p class="text-xs text-gray-500">PNG, JPG, BMP, WEBP</p>
                        </div>
                        <input id="image-upload" type="file" class="hidden" accept="image/*">
                    </label>
                </div>
            </div>
             <div class="text-center">
                <p class="text-lg font-medium text-gray-700 mb-2">hoặc sử dụng Camera</p>
                <div class="flex flex-col space-y-3">
                     <button id="start-camera-btn" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition duration-300 flex items-center justify-center shadow-md">
                        <i class="fas fa-camera mr-2"></i> Mở Camera
                    </button>
                    <button id="capture-btn" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition duration-300 hidden flex items-center justify-center shadow-md">
                        <i class="fas fa-camera-retro mr-2"></i> Chụp ảnh
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Camera Video Stream -->
        <video id="video" class="w-full rounded-lg hidden shadow-inner bg-black" autoplay playsinline></video>
        <canvas id="canvas" class="hidden"></canvas>

        <!-- Image Preview & OCR Trigger -->
        <div id="image-display" class="hidden text-center space-y-4 pt-4">
             <h2 class="text-xl font-semibold text-gray-700">3. Xem trước & Trích xuất</h2>
            <div class="flex justify-center bg-gray-100 p-4 rounded-lg">
                <img id="preview-image" src="#" alt="Image preview" class="max-w-full max-h-96 mx-auto rounded-lg shadow-md object-contain"/>
            </div>
            <button id="extract-btn" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 transition duration-300 text-lg flex items-center justify-center mx-auto disabled:bg-gray-400 shadow-lg">
                <i class="fas fa-magic mr-2"></i> Trích xuất văn bản
            </button>
        </div>

        <!-- Progress and Result Section -->
        <div id="result-section" class="hidden space-y-4 pt-4">
            <h2 class="text-xl font-semibold text-gray-700">4. Kết quả</h2>
            <!-- Progress Bar -->
            <div id="progress-container" class="w-full bg-gray-200 rounded-full h-2.5 hidden">
                 <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
             <p id="progress-label" class="text-center text-gray-600 font-medium"></p>

            <!-- Result Textarea -->
            <div class="relative">
                <textarea id="result-text" class="w-full h-64 p-4 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-gray-50" readonly placeholder="Văn bản được trích xuất sẽ xuất hiện ở đây..."></textarea>
                <button id="copy-btn" class="absolute top-3 right-3 bg-gray-200 text-gray-700 px-3 py-1.5 rounded-md hover:bg-gray-300 transition-colors" title="Sao chép vào clipboard">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
        </div>

    </div>

<script>
    // Lấy các đối tượng DOM
    const imageUpload = document.getElementById('image-upload');
    const previewImage = document.getElementById('preview-image');
    const imageDisplay = document.getElementById('image-display');
    const extractBtn = document.getElementById('extract-btn');
    const resultSection = document.getElementById('result-section');
    const resultText = document.getElementById('result-text');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const progressLabel = document.getElementById('progress-label');
    const copyBtn = document.getElementById('copy-btn');
    const langSelect = document.getElementById('lang-select');
    
    // Các đối tượng DOM cho camera
    const startCameraBtn = document.getElementById('start-camera-btn');
    const captureBtn = document.getElementById('capture-btn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    let stream; // Biến lưu luồng video

    // Xử lý sự kiện khi người dùng tải ảnh lên
    imageUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            if (stream) stopCamera(); // Nếu camera đang mở, tắt nó đi
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                imageDisplay.classList.remove('hidden');
                resultSection.classList.add('hidden');
                resultText.value = '';
            };
            reader.readAsDataURL(file);
        }
    });

    // Xử lý sự kiện khi nhấn nút "Mở Camera"
    startCameraBtn.addEventListener('click', async () => {
        if (stream) {
            stopCamera();
        } else {
            try {
                // Yêu cầu quyền truy cập camera, ưu tiên camera sau
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                video.classList.remove('hidden');
                captureBtn.classList.remove('hidden');
                startCameraBtn.innerHTML = '<i class="fas fa-stop-circle mr-2"></i> Dừng Camera';
                imageDisplay.classList.add('hidden');
            } catch (err) {
                console.error("Lỗi khi truy cập camera: ", err);
                alert("Không thể truy cập camera. Vui lòng cấp quyền và thử lại.");
            }
        }
    });

    // Hàm để dừng camera
    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            video.classList.add('hidden');
            captureBtn.classList.add('hidden');
            startCameraBtn.innerHTML = '<i class="fas fa-camera mr-2"></i> Mở Camera';
            stream = null;
        }
    }

    // Xử lý sự kiện khi nhấn nút "Chụp ảnh"
    captureBtn.addEventListener('click', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const dataUrl = canvas.toDataURL('image/png');
        previewImage.src = dataUrl;
        imageDisplay.classList.remove('hidden');
        resultSection.classList.add('hidden');
        resultText.value = '';
        
        stopCamera();
    });

    // Xử lý sự kiện khi nhấn nút "Trích xuất văn bản"
    extractBtn.addEventListener('click', async () => {
        resultText.value = '';
        resultSection.classList.remove('hidden');
        progressContainer.classList.remove('hidden');
        progressBar.style.width = '0%';
        progressLabel.innerText = 'Đang khởi tạo...';
        extractBtn.disabled = true;

        const selectedLang = langSelect.value;
        
        // Tạo một worker Tesseract để xử lý OCR với ngôn ngữ đã chọn
        const worker = await Tesseract.createWorker(selectedLang, 1, {
            logger: m => { // Theo dõi tiến trình
                console.log(m);
                if (m.status === 'recognizing text') {
                    const progress = Math.floor(m.progress * 100);
                    progressBar.style.width = `${progress}%`;
                    progressLabel.innerText = `Đang nhận dạng... ${progress}%`;
                } else {
                    const statusText = m.status.charAt(0).toUpperCase() + m.status.slice(1);
                    progressLabel.innerText = statusText.replace(/_/g, ' ');
                }
            },
        });

        try {
            // Thực hiện nhận dạng trên ảnh
            const { data: { text } } = await worker.recognize(previewImage.src);
            resultText.value = text;
            progressLabel.innerText = 'Hoàn thành!';
        } catch (error) {
            console.error(error);
            progressLabel.innerText = 'Đã xảy ra lỗi. Vui lòng thử lại.';
            resultText.value = 'Không thể trích xuất văn bản từ hình ảnh này.';
        } finally {
            // Dừng worker để giải phóng tài nguyên
            await worker.terminate();
            extractBtn.disabled = false;
        }
    });

    // Xử lý sự kiện khi nhấn nút "Sao chép"
    copyBtn.addEventListener('click', () => {
        if (!resultText.value) return; // Không làm gì nếu không có text
        resultText.select();
        resultText.setSelectionRange(0, 99999); // Dành cho thiết bị di động
        
        try {
            // Sử dụng document.execCommand để tương thích tốt hơn trong iframe
            document.execCommand('copy');
            const originalIcon = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check text-green-500"></i>';
            setTimeout(() => {
                copyBtn.innerHTML = originalIcon;
            }, 2000);
        } catch (err) {
            console.error('Không thể sao chép: ', err);
            alert('Sao chép thất bại!');
        }
        window.getSelection().removeAllRanges(); // Bỏ chọn văn bản
    });

</script>

</body>
</html>
